<!DOCTYPE html>

<html lang="tr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kehanet | Maç Analiz</title>

<style>

* {

    box-sizing: border-box;

    margin: 0;

    padding: 0;

}

body {

    font-family: Arial, sans-serif;

    background: #0b0b0f;

    color: white;

    min-height: 100vh;

}

.container {

    width: min(1100px, 94%);

    margin: auto;

    padding: 30px 0;

}

header {

    text-align: center;

    margin-bottom: 30px;

}

.logo {

    font-size: 42px;

    font-weight: 900;

    color: #ffd400;

    letter-spacing: 3px;

}

.subtitle {

    color: #aaa;

    margin-top: 8px;

}

.card {

    background: #15151d;

    border: 1px solid #292936;

    border-radius: 18px;

    padding: 25px;

    margin-bottom: 20px;

}

h2 {

    margin-bottom: 20px;

    color: #ffd400;

}

.grid {

    display: grid;

    grid-template-columns: repeat(2, 1fr);

    gap: 15px;

}

input, select {

    width: 100%;

    padding: 14px;

    border-radius: 10px;

    border: 1px solid #333;

    background: #0e0e14;

    color: white;

    font-size: 15px;

}

button {

    width: 100%;

    margin-top: 20px;

    padding: 16px;

    border: none;

    border-radius: 12px;

    background: #ffd400;

    color: #111;

    font-size: 17px;

    font-weight: bold;

    cursor: pointer;

}

button:hover {

    transform: scale(1.01);

}

.result {

    display: none;

}

.prediction {

    text-align: center;

    padding: 25px;

    border-radius: 15px;

    background: #20202a;

    margin-bottom: 20px;

}

.score {

    font-size: 42px;

    font-weight: bold;

    color: #ffd400;

    margin: 10px 0;

}

.confidence {

    font-size: 20px;

    color: #5cff8d;

}

.stats {

    display: grid;

    grid-template-columns: repeat(3, 1fr);

    gap: 12px;

}

.stat {

    background: #20202a;

    padding: 18px;

    border-radius: 12px;

    text-align: center;

}

.stat strong {

    display: block;

    font-size: 24px;

    color: #ffd400;

    margin-bottom: 5px;

}

.warning {

    margin-top: 20px;

    color: #aaa;

    font-size: 13px;

    text-align: center;

}

@media(max-width:700px) {

    .grid {

        grid-template-columns: 1fr;

    }

    .stats {

        grid-template-columns: 1fr;

    }

    .logo {

        font-size: 32px;

    }

}

</style>

</head>

<body>

<div class="container">

<header>

    <div class="logo">KEHANET</div>

    <div class="subtitle">Oran • Form • Kadro • İstatistik • Tahmin</div>

</header>

<div class="card">

<h2>⚽ Maç Bilgileri</h2>

<div class="grid">

<input id="home" placeholder="Ev sahibi takım">

<input id="away" placeholder="Deplasman takımı">

<input id="homeOdds" type="number" step="0.01" placeholder="MS 1 oranı">

<input id="drawOdds" type="number" step="0.01" placeholder="MS X oranı">

<input id="awayOdds" type="number" step="0.01" placeholder="MS 2 oranı">

<input id="overOdds" type="number" step="0.01" placeholder="2.5 ÜST oranı">

<input id="underOdds" type="number" step="0.01" placeholder="2.5 ALT oranı">

<input id="homeForm" type="number" min="0" max="100" placeholder="Ev form %">

<input id="awayForm" type="number" min="0" max="100" placeholder="Deplasman form %">

<input id="homeStrength" type="number" min="0" max="100" placeholder="Ev takım gücü %">

<input id="awayStrength" type="number" min="0" max="100" placeholder="Deplasman takım gücü %">

</div>

<button onclick="analyze()">KEHANETİ ÇALIŞTIR 🔮</button>

</div>

<div class="card result" id="result">

<h2>🔮 KEHANET SONUCU</h2>

<div class="prediction">

<div id="predictionText">-</div>

<div class="score" id="score">-</div>

<div class="confidence" id="confidence">-</div>

</div>

<div class="stats">

<div class="stat">

<strong id="pHome">-%</strong>

Ev Kazanma

</div>

<div class="stat">

<strong id="pDraw">-%</strong>

Beraberlik

</div>

<div class="stat">

<strong id="pAway">-%</strong>

Deplasman

</div>

</div>

<div class="stats" style="margin-top:12px">

<div class="stat">

<strong id="goalPrediction">-</strong>

Gol Beklentisi

</div>

<div class="stat">

<strong id="overPrediction">-</strong>

2.5 Üst

</div>

<div class="stat">

<strong id="bothPrediction">-</strong>

KG

</div>

</div>

<div class="warning">

Bu sistem matematiksel/istatistiksel bir tahmin modelidir. Kesin sonuç garantisi vermez.

</div>

</div>

</div>

<script>

function val(id) {

    return parseFloat(document.getElementById(id).value) || 0;

}

function analyze() {

    let home = val("homeForm");

    let away = val("awayForm");

    let homeStrength = val("homeStrength");

    let awayStrength = val("awayStrength");

    let hOdds = val("homeOdds");

    let dOdds = val("drawOdds");

    let aOdds = val("awayOdds");

    if (!hOdds || !dOdds || !aOdds) {

        alert("Lütfen MS 1, X ve MS 2 oranlarını gir.");

        return;

    }

    let h = 1 / hOdds;

    let d = 1 / dOdds;

    let a = 1 / aOdds;

    let total = h + d + a;

    let marketHome = h / total;

    let marketDraw = d / total;

    let marketAway = a / total;

    let formEffect = (home - away) / 100;

    let strengthEffect = (homeStrength - awayStrength) / 100;

    let homeScore =

        marketHome * 0.65 +

        ((0.5 + formEffect * 0.25 + strengthEffect * 0.25)) * 0.35;

    let awayScore =

        marketAway * 0.65 +

        ((0.5 - formEffect * 0.25 - strengthEffect * 0.25)) * 0.35;

    let drawScore = marketDraw * 0.65 + 0.5 * 0.35;

    let totalScore = homeScore + drawScore + awayScore;

    let pHome = homeScore / totalScore;

    let pDraw = drawScore / totalScore;

    let pAway = awayScore / totalScore;

    document.getElementById("pHome").innerText =

        Math.round(pHome * 100) + "%";

    document.getElementById("pDraw").innerText =

        Math.round(pDraw * 100) + "%";

    document.getElementById("pAway").innerText =

        Math.round(pAway * 100) + "%";

    let prediction;

    if (pHome > pDraw && pHome > pAway) {

        prediction = "1 — EV SAHİBİ DAHA AVANTAJLI";

    } else if (pAway > pDraw && pAway > pHome) {

        prediction = "2 — DEPLASMAN DAHA AVANTAJLI";

    } else {

        prediction = "X — BERABERLİK İHTİMALİ YÜKSEK";

    }

    let difference =

        Math.max(pHome, pDraw, pAway);

    let confidence =

        Math.round(50 + difference * 45);

    document.getElementById("predictionText").innerText =

        prediction;

    document.getElementById("confidence").innerText =

        "Güven seviyesi: %" + confidence;

    let goalExpectation =

        1.8 +

        Math.abs(formEffect) * 1.2 +

        Math.abs(strengthEffect) * 1.0;

    document.getElementById("goalPrediction").innerText =

        goalExpectation.toFixed(1);

    let overOdds = val("overOdds");

    let overProbability =

        overOdds ? (1 / overOdds) * 100 : 50;

    document.getElementById("overPrediction").innerText =

        Math.round(overProbability) + "%";

    let both =

        Math.min(95, Math.max(25, goalExpectation * 25));

    document.getElementById("bothPrediction").innerText =

        Math.round(both) + "%";

    let homeGoals = Math.max(

        0,

        Math.round((1.2 + (pHome - pAway) * 2) * 10) / 10

    );

    let awayGoals = Math.max(

        0,

        Math.round((0.9 + (pAway - pHome) * 2) * 10) / 10

    );

    document.getElementById("score").innerText =

        Math.round(homeGoals) + " - " + Math.round(awayGoals);

    document.getElementById("result").style.display = "block";

    document.getElementById("result").scrollIntoView({

        behavior: "smooth"

    });

}

</script>

</body>

</html>
